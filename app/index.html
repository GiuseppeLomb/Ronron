<!doctype html>
<html lang="pt-PT" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F7F1E8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://challenges.cloudflare.com; img-src 'self' data: blob: https://*.supabase.co; media-src 'self' blob: https://*.supabase.co; style-src 'self' 'unsafe-inline'; font-src 'self' data:">
<title>Ronron</title>
<link rel="icon" href="./icon.svg" type="image/svg+xml">
</head>
<body>
<div id="app" class="app">
  <header class="head"><div class="wrap">
    <a class="logo" href="#feed" aria-label="Ronron, início"><span class="logo-rr" id="logo-rr"></span><span class="rr-bubble" id="logo-bubble" role="status"></span><span class="word">Ronron</span></a>
    <nav class="nav" aria-label="Principal" id="nav-top"></nav>
    <div class="head-r"><button class="icon-btn" id="btn-def" aria-label="Definições"></button></div>
  </div></header>
  <main class="view" id="view"></main>
  <nav class="tabs" aria-label="Principal"><div class="wrap" id="nav-bottom"></div></nav>
  <div class="offline" id="offline" hidden role="status"><span id="offline-rr"></span><span>Sem ligação. Mostro os últimos gatos que vi; o resto volta quando houver rede.</span></div>
  <div class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-label="Ficha do gato"></div>
  <div class="meet" id="meet" hidden role="dialog" aria-modal="true" aria-labelledby="meet-t"><div class="meet-card" id="meet-card"></div></div>
  <div class="celebra" id="celebra" hidden role="dialog" aria-modal="true"><div class="box" id="celebra-box"></div></div>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
