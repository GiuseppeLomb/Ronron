# Compila a app Android (Capacitor).
# - staging (por omissão, a cada push): APK de teste publicado como pré-lançamento no GitHub.
# - production (só à mão: Actions > App Android > Run workflow > ambiente = production): .aab assinado para a Google Play
#   e APK de lançamento, guardados como ficheiros privados da execução (não ficam públicos).
# versionCode: testes = número da execução; lançamento = MAJOR*1000000 + MINOR*10000 + PATCH*100 + revisão (1.0.0 -> 1000000).
name: App Android

on:
  push:
    branches: [ccr-6d9a78cf-u80ufo, main]
    paths: ['app/**', '.github/workflows/android.yml']
  workflow_dispatch:
    inputs:
      ambiente:
        description: 'staging ou production'
        default: 'staging'
      revisao:
        description: 'Só lançamento: revisão da mesma versão (0-99), para voltar a enviar à Play Store'
        default: '0'

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: app } }
    env:
      AMBIENTE: ${{ github.event.inputs.ambiente || 'staging' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: app/package-lock.json }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: SDK do Android 16 (API 36), com o sdkmanager que já vem no Ubuntu
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0" > /dev/null
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
      - run: npm ci
      - name: Compilar a app (${{ env.AMBIENTE }})
        run: npx vite build --mode $AMBIENTE
      - run: npx cap sync android
      - name: Chave de carregamento (segredos do GitHub)
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KS_B64" ]; then echo "::error::Faltam os segredos ANDROID_KEYSTORE_BASE64 e ANDROID_KEYSTORE_PASSWORD (Settings > Secrets and variables > Actions)."; exit 1; fi
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/ronron-upload.jks"
          echo "RONRON_KEYSTORE=$RUNNER_TEMP/ronron-upload.jks" >> "$GITHUB_ENV"
      - name: APK assinado (testes) e .aab (Google Play)
        working-directory: app/android
        env:
          RONRON_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          V="$(node -p "require('../package.json').version")"
          if [ "$AMBIENTE" = "production" ]; then
            IFS=. read -r MA MI PA <<< "$V"
            export RONRON_VERSION_CODE=$(( MA*1000000 + MI*10000 + PA*100 + ${{ github.event.inputs.revisao || 0 }} ))
          else
            export RONRON_VERSION_CODE="$GITHUB_RUN_NUMBER"
          fi
          export RONRON_VERSION_NAME="$V"
          echo "versionName $V · versionCode $RONRON_VERSION_CODE · $AMBIENTE"
          echo "RONRON_VERSION_CODE=$RONRON_VERSION_CODE" >> "$GITHUB_ENV"
          ./gradlew --no-daemon assembleRelease bundleRelease
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk | grep -i "SHA-1"
      - name: Lançamento — preparar ficheiros para a Google Play
        if: env.AMBIENTE == 'production'
        run: |
          V=$(node -p "require('./package.json').version")
          mkdir -p ../lancamento
          cp android/app/build/outputs/bundle/release/app-release.aab "../lancamento/ronron-${V}-${RONRON_VERSION_CODE}.aab"
          cp android/app/build/outputs/apk/release/app-release.apk "../lancamento/ronron-${V}-${RONRON_VERSION_CODE}-verificar.apk"
          ls -la ../lancamento
      - name: Lançamento — guardar o .aab (Google Play)
        if: env.AMBIENTE == 'production'
        uses: actions/upload-artifact@v4
        with:
          name: ronron-play-store-aab
          path: lancamento/*.aab
          retention-days: 90
      - name: Lançamento — guardar o APK (só para verificar no telemóvel)
        if: env.AMBIENTE == 'production'
        uses: actions/upload-artifact@v4
        with:
          name: ronron-apk-lancamento
          path: lancamento/*.apk
          retention-days: 90
      - name: Testes — publicar o APK para instalar no telemóvel
        if: env.AMBIENTE != 'production'
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          V=$(node -p "require('./package.json').version")
          N="ronron-${V}-${AMBIENTE}-${GITHUB_RUN_NUMBER}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$N"
          gh release create "teste-${GITHUB_RUN_NUMBER}" "$N" --prerelease --target "$GITHUB_SHA" \
            --title "Ronron ${V} (testes ${GITHUB_RUN_NUMBER})" \
            --notes "APK de teste (${AMBIENTE}), assinado com a chave de carregamento. No telemóvel: descarrega o ficheiro .apk e abre-o; o Android pede para permitir instalar apps desta origem."
      - name: Apagar a chave do servidor
        if: always()
        run: rm -f "$RUNNER_TEMP/ronron-upload.jks"
